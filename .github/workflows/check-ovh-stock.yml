name: Check OVH VPS stock

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovh-vps-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OVH_API_URL: https://ca.api.ovh.com/v1/vps/order/rule/datacenter
      OVH_SUBSIDIARY: WE
      OVH_PLAN_CODE: vps-2027-model2
      OVH_PLAN_LABEL: VPS Model 2
      OVH_OS: Ubuntu 25.04
      OVH_DATACENTER: DE
      OVH_LOCATION_CODE: eu-west-lim
      OVH_LOCATION_LABEL: Germany - Limburg
      OVH_CONFIGURATOR_URL: https://www.ovhcloud.com/en/vps/configurator/?planCode=vps-2027-model2.LZ&brick=VPS%2BModel%2B2&pricing=upfront12&processor=%20&vcore=4__vCore&storage=75__SSD__NVMe
      STATE_FILE: .state/ovh-stock.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Restore stock state
        uses: actions/cache/restore@v6
        with:
          path: .state/ovh-stock.json
          key: ovh-vps-stock-state-${{ github.run_id }}
          restore-keys: |
            ovh-vps-stock-state-

      - name: Check stock
        id: stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_ovh_stock.py

      - name: Save changed stock state
        if: steps.stock.outputs.state_changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .state/ovh-stock.json
          key: ovh-vps-stock-state-${{ github.run_id }}
