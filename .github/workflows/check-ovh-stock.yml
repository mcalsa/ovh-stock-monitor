name: Check OVH VPS stock (Francia)

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      confirm_startup:
        description: "Forzar mensaje de confirmacion (bot vivo) aunque no haya stock nuevo"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ovh-vps-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OVH_API_URL: https://eu.api.ovh.com/v1/vps/order/rule/datacenter
      OVH_SUBSIDIARY: WE
      OVH_PLAN_CODES: vps-2027-model2,vps-2027-model3,vps-2027-model4
      OVH_TARGET_DATACENTERS: GRA,SBG,EU-WEST-RBX
      OVH_CONFIGURATOR_URL_TEMPLATE: "https://www.ovhcloud.com/es-es/vps/configurator/?planCode={plan}.LZ&brick=VPS%2BModel%2B2&pricing=upfront12&processor=%20&vcore=4__vCore&storage=75__SSD__NVMe"
      OVH_FORCE_STARTUP_MESSAGE: ${{ github.event.inputs.confirm_startup || 'false' }}
      STATE_FILE: .state/ovh-stock.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install requests

      - name: Restore stock state
        uses: actions/cache/restore@v6
        with:
          path: .state/ovh-stock.json
          key: ovh-vps-stock-state-${{ github.run_id }}
          restore-keys: |
            ovh-vps-stock-state-

      - name: Check stock
        id: stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_ovh_stock.py

      - name: Save changed stock state
        if: steps.stock.outputs.state_changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .state/ovh-stock.json
          key: ovh-vps-stock-state-${{ github.run_id }}
